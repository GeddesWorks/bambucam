[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bambucam"
version = "0.1.0"
description = "Autonomous DSLR timelapse system for Bambu Lab A1"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "appwrite>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
include = ["bambucam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
